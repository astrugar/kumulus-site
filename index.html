<!doctype html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="NVO Kumulus — vazduhoplovno jedriličarstvo i ultralako letenje.">
<title>NVO Kumulus — verzija 2</title>

</head>
<body>
<div>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,200..800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#b9c8d2;color:#2e3439;font-family:"Archivo",system-ui,sans-serif}
a{color:#2e3439}a:hover{color:#4d6b80}
.k{position:relative;width:100%;height:100vh;min-height:560px;overflow:hidden;background:linear-gradient(to top,#b3c4cf 0%,#b9c8d2 35%,#cfdae1 70%,#e6ecef 100%);display:flex;flex-direction:column}
.sky{position:absolute;inset:0;pointer-events:none}
.sky svg{display:block;width:100%;height:100%}
.back{z-index:0}.front{z-index:3}
.drift{animation:k-drift linear infinite}
@keyframes k-drift{from{transform:translate(1900px,260px)}to{transform:translate(-700px,-200px)}}

.head{position:relative;z-index:4;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:28px clamp(16px,4vw,64px);animation:k-in 1s .2s both ease-out}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;font-family:"JetBrains Mono",monospace;font-size:14px;letter-spacing:.04em}
.brand svg{width:34px;height:auto}
.mail{font-family:"JetBrains Mono",monospace;font-size:14px;text-decoration:none;border-bottom:1px solid currentColor;padding:12px 0 2px}
.main{position:relative;z-index:5;flex-grow:1;display:flex;align-items:flex-end;justify-content:space-between;align-content:flex-end;flex-wrap:wrap;gap:20px 32px;padding:0 clamp(16px,4vw,64px) clamp(24px,5vh,56px);pointer-events:none}
.brandblock{--ts:clamp(54px,10.8vw,210px);display:flex;flex-direction:column;align-items:flex-start;width:100%}
.nvo-top{font-stretch:125%;font-weight:300;font-size:clamp(14px,1.8vw,30px);letter-spacing:.14em;color:#5d6973;margin:0 0 clamp(2px,.4vw,8px) calc(var(--ts) * .075);animation:k-in 1s .2s both ease-out}
.main a{pointer-events:auto}
.nvo{font-family:"JetBrains Mono",monospace;font-size:clamp(12px,1.1vw,15px);letter-spacing:.6em;animation:k-in 1.2s .8s both ease-out}
.title{margin:clamp(6px,1vh,12px) 0 0 -.04em;display:flex;font-stretch:125%;font-weight:200;font-size:var(--ts);line-height:.86;letter-spacing:-.015em;white-space:nowrap;text-transform:uppercase}
.title span{display:inline-block;animation:k-fade 2s cubic-bezier(.2,.7,.2,1) both}
.title span:nth-child(1){animation-delay:.3s}.title span:nth-child(2){animation-delay:.4s}.title span:nth-child(3){animation-delay:.5s}.title span:nth-child(4){animation-delay:.6s}.title span:nth-child(5){animation-delay:.7s}.title span:nth-child(6){animation-delay:.8s}.title span:nth-child(7){animation-delay:.9s}
@keyframes k-fade{from{opacity:0;filter:blur(12px)}to{opacity:1;filter:blur(0)}}
@keyframes k-in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.cta{display:flex;margin-left:auto;animation:k-in 1s 1.4s both ease-out}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 14px;border-radius:999px;background:#2e3439;color:#f2ede3;text-decoration:none;font-weight:500;font-size:12.5px;letter-spacing:.02em;transition:transform .25s}
.btn:hover{color:#f2ede3;transform:translateY(-2px)}
.btn svg{width:13px;height:13px;transition:transform .25s}
.btn:hover svg{transform:translateX(4px)}
@media (max-width:420px){.brand,.mail{font-size:12px}}
</style>

<script>
function fit(){const b=document.getElementById('bb');b.style.removeProperty('--ts');if(innerWidth>700)return;const sp=b.querySelectorAll('.title span');const f=sp[0].getBoundingClientRect(),l=sp[sp.length-1].getBoundingClientRect();const base=parseFloat(getComputedStyle(sp[0]).fontSize);b.style.setProperty('--ts',(base*b.clientWidth/(l.right-f.left)*0.995).toFixed(2)+'px');}
addEventListener('load',()=>{fit();setTimeout(fit,2300)});addEventListener('resize',fit);if(document.fonts)document.fonts.ready.then(fit);
</script>
